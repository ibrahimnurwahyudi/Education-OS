name: Deploy Education OS + Public Website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build operational Education OS
        run: npm run build
      - name: Assemble deterministic Pages artifact
        run: |
          rm -rf pages-site
          mkdir -p pages-site/app
          cp -R website/. pages-site/
          cp -R dist/. pages-site/app/
          rm -f pages-site/vercel.json
          find pages-site -maxdepth 2 -type f | sort | head -80
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./pages-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy deterministic Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
